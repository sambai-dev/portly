[package]
name = "portly"
version = "0.1.0"
edition = "2021"
description = "Terminal cockpit for everything running on your machine's ports"
license = "MIT"
repository = "https://github.com/sambai-dev/portly"
readme = "README.md"
keywords = ["tui", "ports", "devtools", "docker", "process"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["sync"] }
netstat2 = "0.9"
sysinfo = "0.31"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
